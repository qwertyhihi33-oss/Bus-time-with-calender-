name: Android CI & Direct APK Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for Direct Phone Download
        run: cp app/build/outputs/apk/debug/app-debug.apk HKBusCalendarApp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HKBusCalendarApp-debug-apk
          path: HKBusCalendarApp.apk
          if-no-files-found: error

      - name: Publish Direct-Download APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: HK Bus Calendar (Latest APK)
          body: Direct-download Android APK built automatically from source. Tap HKBusCalendarApp.apk below on your Android phone to download and install.
          make_latest: true
          files: HKBusCalendarApp.apk
